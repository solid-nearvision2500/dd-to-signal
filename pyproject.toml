[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dd-to-signal"
version = "0.1.0"
description = "Diff every SEC filing against the last one, and surface what companies quietly rewrote."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GeoCodeCrafter" }]
keywords = ["sec", "edgar", "10-K", "filings", "nlp", "diff", "finance", "equity-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "requests>=2.31",
  "lxml>=5.0",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/GeoCodeCrafter/dd-to-signal"
Source = "https://github.com/GeoCodeCrafter/dd-to-signal"
Issues = "https://github.com/GeoCodeCrafter/dd-to-signal/issues"

[project.scripts]
dd-to-signal = "ddsignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ddsignal"]

[tool.hatch.build.targets.wheel.force-include]
"data/lexicons" = "ddsignal/_data/lexicons"
"data/sample" = "ddsignal/_data/sample"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
