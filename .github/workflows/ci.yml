name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"

      # The suite runs against the bundled filings, so CI needs no network and
      # never touches EDGAR. A green build here is not paid for by the SEC.
      - run: pytest -q

      - run: ruff check .
